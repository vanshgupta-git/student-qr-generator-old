<html lang="en">
<head>

    <title>Intern ID Generator</title>
</head>
<body>

    <div class="card">
        <img src="assets/brandLogo.jpeg" alt="GIFT A SMILE FOUNDATION">
        <h2>Intern ID Generator</h2>
<form id="registrationForm">

    <input type="file" id="userImage" accept="image/*" hidden>
    
    <label for="userImage" class="upload-btn">
        Capture Your Photo
    </label>
    
    <span id="fileName">No Photo Captured Yet</span>
    <img id="preview" width="250" style="display:none;">

    <input type="text" id="name" placeholder="Name" required>
    <input type="text" id="college" placeholder="College" required>
    <input type="text" id="course" placeholder="Course" required>
    <input type="text" id="branch" placeholder="Branch (if any)">
    <input type="email" id="email" placeholder="Email" required>
    
    <button type="submit">Generate ID</button>
</form>

        <canvas id="idCardCanvas"></canvas>
        <div id="downloadContainer"></div>
    </div>
    
<script src = "https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
